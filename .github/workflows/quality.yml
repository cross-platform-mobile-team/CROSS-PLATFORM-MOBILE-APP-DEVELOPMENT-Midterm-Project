name: Quality and Android

on:
  push:
    branches: [main-test]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-quality:
    name: Windows quality gates
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Environment
        run: |
          flutter --version
          dart --version
          node --version
      - name: Flutter dependencies
        run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Flutter tests
        run: flutter test --coverage
      - name: Backend syntax and tests
        shell: pwsh
        run: |
          node --check backend/src/server.js
          node --check backend/src/api.js
          node --check backend/src/store.js
          node --check backend/src/security.js
          node --check backend/src/validation.js
          node --check backend/src/openapi.js
          node --check backend/scripts/backup.js
          Push-Location backend
          node --test --test-concurrency=1
          Pop-Location
      - name: Web release
        run: flutter build web --release
      - name: Windows release
        run: flutter build windows --release

  android-build:
    name: Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Install Android build components
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Flutter dependencies
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Build release APK
        run: flutter build apk --release
      - name: Record checksums
        shell: bash
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-debug.apk app-release.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: taskflow-android-apks
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  android-e2e:
    name: Android E2E (API 36)
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Enable KVM
        shell: bash
        run: |
          sudo usermod -a -G kvm "$USER"
          sudo chown "$USER" /dev/kvm
      - name: Install Android build components
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Flutter dependencies
        run: flutter pub get
      - name: Run isolated Android workflows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            flutter test integration_test/independent_scenarios_test.dart -d emulator-5554
            flutter test integration_test/persisted_scenarios_test.dart -d emulator-5554
            flutter test integration_test/windows_workflow_test.dart -d emulator-5554
