name: Quality and Android

on:
  push:
    branches: [main-test]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-quality:
    name: Windows quality gates
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Environment
        run: |
          flutter --version
          dart --version
          node --version
      - name: Flutter dependencies
        run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Flutter tests
        run: flutter test --coverage
      - name: Edge runner contracts (synthetic, no browser)
        shell: pwsh
        run: ./scripts/tests/edge-runner-contract.ps1
      - name: Toolchain and backend CI contracts (synthetic)
        shell: pwsh
        run: |
          ./scripts/tests/android-environment-contract.ps1
          ./scripts/tests/flutter-resolver-contract.ps1
          ./scripts/tests/backend-ci-contract.ps1
      - name: Backend syntax and tests
        shell: pwsh
        run: |
          foreach ($file in @('src/server.js', 'src/api.js', 'src/store.js', 'src/security.js', 'src/validation.js', 'src/openapi.js', 'scripts/backup.js')) {
            node --check "backend/$file"
            if ($LASTEXITCODE -ne 0) { throw "Backend syntax check failed for $file with code $LASTEXITCODE" }
          }
          Push-Location backend
          try {
            node --test --test-concurrency=1
            if ($LASTEXITCODE -ne 0) { throw "Backend tests failed with code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
      - name: Web release
        run: flutter build web --release
      - name: Windows release
        run: flutter build windows --release
      - name: Windows native workflows
        shell: pwsh
        run: |
          foreach ($suite in @('independent_scenarios', 'persisted_scenarios', 'windows_workflow', 'quick_create_exit', 'pending_capture')) {
            flutter test "integration_test/${suite}_test.dart" -d windows --reporter expanded
            if ($LASTEXITCODE -ne 0) { throw "Native suite failed: $suite" }
          }
          ./scripts/test-online-windows.ps1

  android-build:
    name: Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Install Android build components
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
      - name: Flutter dependencies
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Build release APK
        run: flutter build apk --release
      - name: Record checksums
        shell: bash
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-debug.apk app-release.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: taskflow-android-apks
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  android-e2e:
    name: Android E2E (API 36)
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - name: Enable KVM
        shell: bash
        run: |
          sudo usermod -a -G kvm "$USER"
          sudo chown "$USER" /dev/kvm
      - name: Install Android build components
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"
      - name: Flutter dependencies
        run: flutter pub get
      - name: Run isolated Android workflows
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            flutter test integration_test/independent_scenarios_test.dart -d emulator-5554
            flutter test integration_test/persisted_scenarios_test.dart -d emulator-5554
            flutter test integration_test/windows_workflow_test.dart -d emulator-5554
            flutter test integration_test/quick_create_exit_test.dart -d emulator-5554
            flutter test integration_test/pending_capture_test.dart -d emulator-5554
            node scripts/test-online-native.mjs --device emulator-5554 --host 10.0.2.2
